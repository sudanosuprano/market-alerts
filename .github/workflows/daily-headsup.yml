name: Daily heads-up
# 21:00 UTC Sun-Thu = 8am Sydney Mon-Fri in summer (7am in winter).
on:
  schedule:
    - cron: '0 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

env:
  SUDDY_TZ: Australia/Sydney
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

jobs:
  headsup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Build and send the heads-up
        run: |
          claude -p "$(cat prompts/daily-headsup.md)" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --max-turns 40
      - name: Save state
        if: always()
        run: bash .github/save-state.sh "daily heads-up"
