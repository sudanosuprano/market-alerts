name: Send test push
# Run it from the Actions tab (Send test push > Run workflow) to check phone alerts still work.
on:
  workflow_dispatch:

env:
  SUDDY_TZ: Australia/Sydney
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send
        shell: pwsh
        run: ./send-ntfy.ps1 -Title "Cloud alerts connected" -Message "Test push from GitHub. Your alerts now run with your PC off."
