name: Week-ahead report
# Sunday 07:00 UTC = 6pm Sydney in summer (5pm in winter). Claude builds the report and pushes it to ntfy.
on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

env:
  SUDDY_TZ: Australia/Sydney
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Build and send the report
        run: |
          claude -p "$(cat prompts/weekly-report.md)" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --max-turns 80
      - name: Save state
        if: always()
        run: bash .github/save-state.sh "weekly report"
