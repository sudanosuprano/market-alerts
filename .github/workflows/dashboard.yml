name: Dashboard data
# Hourly: refresh this week's calendar, the next 4 weeks, and rebuild the dashboard page (docs/index.html).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

env:
  SUDDY_TZ: Australia/Sydney

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh calendar and rebuild page
        shell: pwsh
        run: ./build-dashboard.ps1 -Refresh
      - name: Save state
        run: bash .github/save-state.sh "dashboard refresh"
