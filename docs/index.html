function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60); if (h < 24) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}
// Current NY trading day: from 6pm ET it's already the next day's session
function nyTradingDay() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false })
    .formatToParts(new Date()).map(p => [p.type, p.value]));
  const d = new Date(`${parts.year}-${parts.month}-${parts.day}T12:00:00`);
  if (+parts.hour >= 18) d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}

// Futures session for a trading day opens 6pm New York time the evening before; show that in Sydney time
function sessionOpen(day) {
  const prev = new Date(day + 'T12:00:00Z'); prev.setUTCDate(prev.getUTCDate() - 1);
  const ymd = prev.toISOString().slice(0, 10);
  for (const utcHour of [22, 23]) {
    const t = new Date(`${ymd}T${utcHour}:00:00Z`);
    const h = +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hour12: false }).format(t);
    if (h === 18) return t.toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  }
  return '';
}

function render() {
  const today = nyTradingDay();
  $('clock').innerHTML = `Sydney <b>${new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' })}</b> · New York <b>${new Date().toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' })}</b>`;
  if (!WEEK) { $('week').innerHTML = '<div class="empty">No data yet. Run build-dashboard.ps1 -Refresh.</div>'; return; }

  const d0 = WEEK.days[0], d4 = WEEK.days[WEEK.days.length - 1];
  $('weekTitle').textContent = `Market week · ${fmtDate(d0)} – ${fmtDate(d4)} (NY trading days, Sydney times)`;

  // Next OPEX countdown
  if (WEEK.nextOpex) {
    const days = Math.round((new Date(WEEK.nextOpex.day + 'T12:00:00') - new Date(today + 'T12:00:00')) / 864e5);
    $('opexChip').innerHTML = `Next ${WEEK.nextOpex.quad ? '<b>QUAD WITCHING</b>' : 'monthly OPEX'} · ${fmtDate(WEEK.nextOpex.day)} · ${days <= 0 ? 'today' : days + 'd'}`;
  }

  // Flags strip
  const flags = [];
  for (const o of WEEK.opex) flags.push(`<div class="flag">${o.kind === 'roll' ? 'ES/NQ roll' : esc(o.label)} · <b>${fmtDay(o.day)} ${fmtDate(o.day)}</b>${o.kind === 'roll' ? ' · check your MNQ contract month' : ''}</div>`);
  for (const h of WEEK.holidays.filter(h => h.country === 'US market')) flags.push(`<div class="flag hol">US market: ${esc(h.name)} · <b>${fmtDay(h.day)}</b></div>`);
  if (WEEK.ffStale) flags.push(`<div class="flag warn">Red folder feed hasn't rolled to this week yet. Check ForexFactory or the Sunday report.</div>`);
  for (const w of (WEEK.warnings || []).filter(w => !w.startsWith('FF_STALE'))) flags.push(`<div class="flag warn">${esc(w)}</div>`);
  $('flags').innerHTML = flags.join('');

  // Day columns
  $('week').innerHTML = WEEK.days.map(day => {
    const ev = WEEK.events.filter(e => e.day === day).sort((a, b) => a.sort - b.sort);
    const er = WEEK.earnings.filter(e => e.day === day).sort((a, b) => (a.tag === 'MAG7' ? 0 : a.tag === 'NQ' ? 1 : 2) - (b.tag === 'MAG7' ? 0 : b.tag === 'NQ' ? 1 : 2) || b.capB - a.capB);
    const badges = [
      ...WEEK.opex.filter(o => o.day === day).map(o => `<span class="badge ${o.kind}">${o.kind === 'roll' ? 'Roll date' : esc(o.label)}</span>`),
      ...WEEK.holidays.filter(h => h.day === day).map(h => h.country === 'US market'
        ? `<span class="badge ${/^CLOSED/.test(h.name) ? 'closed' : 'early'}">${/^CLOSED/.test(h.name) ? 'US closed' : 'Early close 1pm ET'}</span>`
        : `<span class="badge bank" title="${esc(h.name)}">${esc(h.country.replace(' bank holiday', ''))} hol: ${esc(h.name.replace(/ \(.*\)$/, ''))}</span>`)
    ].join('');
    const evHtml = ev.length ? ev.map(e => {
      const sessCls = e.session === 'Asia' ? 'asia' : e.session === 'NY open' ? 'nyopen' : '';
      const fp = [e.forecast && `F ${esc(e.forecast)}`, e.previous && `P ${esc(e.previous)}`].filter(Boolean).join(' · ');
      return `<div class="ev ${e.impact === 'High' ? 'high' : 'med'}" data-cc="${esc(e.country)}">
        <div class="dot"></div>
        <div>
          <div class="ev-time">${esc(e.local.replace(/^\w+ /, ''))}<small>${esc(e.ny.replace(/^\w+ /, ''))}</small></div>
          <div class="ev-title"><span class="cc">${esc(e.country)}</span>${esc(e.title)}</div>
          <div class="ev-meta"><span class="sess ${sessCls}">${esc(e.session)}</span>${fp ? `<span>${fp}</span>` : ''}</div>
        </div></div>`;
    }).join('') : `<div class="empty">${WEEK.ffStale ? 'Feed not updated yet' : 'No red folder events'}</div>`;
    const tk = list => list.map(x => `<span class="tk ${x.tag}" title="${esc(x.name)} · $${x.capB}B">${esc(x.symbol)}${x.tag ? '' : `<small>$${x.capB}B</small>`}</span>`).join('');
    const groups = [['BMO', 'Before open'], ['AMC', 'After close'], ['TBC', 'Time TBC']]
      .map(([k, label]) => { const l = er.filter(x => x.time === k); return l.length ? `<div class="earn-group">${label}</div><div class="tickers">${tk(l)}</div>` : ''; }).join('');
    const cls = day === today ? 'today' : day < today ? 'past' : '';
    return `<section class="day ${cls}">
      <div class="day-head">
        <div class="day-name">${fmtDay(day)}${day === today ? '<span class="today-pill">TODAY</span>' : ''}</div>
        <div class="day-date">${fmtDate(day)} · opens ${sessionOpen(day)} Sydney</div>
        ${badges ? `<div class="badges">${badges}</div>` : ''}
      </div>
      <div class="section"><div class="sec-title">Economic events</div>${evHtml}</div>
      <div class="section"><div class="sec-title">Earnings</div>${groups || '<div class="empty">No major earnings</div>'}</div>
    </section>`;
  }).join('');

  // News
  $('newsCount').textContent = NEWS.length ? `last 7 days · ${NEWS.length}` : '';
  let lastDay = '';
  $('news').innerHTML = NEWS.length ? NEWS.map(n => {
    const m = n.text.match(/^(GOLD|OIL):\s*/i);
    const txt = m ? n.text.slice(m[0].length) : n.text;
    const dayLabel = new Date(n.t).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'short' });
    const sep = dayLabel !== lastDay ? `<div class="news-day">${dayLabel}</div>` : ''; lastDay = dayLabel;
    return sep + `<a class="nw ${n.score < 8 ? 'notable' : ''}" ${n.link ? `href="${esc(n.link)}" target="_blank" rel="noopener"` : ''}>
      <div class="score s${n.score}">${n.score}</div>
      <div><div class="nw-text">${m ? `<span class="tag-go">${esc(m[1].toUpperCase())}</span>` : ''}${esc(txt)}</div>
      <div class="nw-time">${ago(n.t)} · ${new Date(n.t).toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</div></div></a>`;
  }).join('') : '<div class="empty">No market-moving headlines in the last 7 days.</div>';

  $('ahead').innerHTML = (WEEK.mag7Ahead && WEEK.mag7Ahead.length)
    ? WEEK.mag7Ahead.map(a => `<span class="tk MAG7">${esc(a)}</span>`).join('')
    : '<div class="empty">None on the calendar yet. Dates usually appear 3–5 weeks out.</div>';

  renderFuture();
  renderFed();
  $('foot').textContent = `Calendar data refreshed ${ago(WEEK.generated)} · page built ${ago(BUILT)} · reloads every 5 min · Sources: ForexFactory, Nasdaq, Nager.Date, Bloomberg/CNBC/WSJ/FT/MarketWatch RSS. Not financial advice.`;
  if (!'reports/2026-11-30-weekly.md'.includes('reports/') && $('reportLink').getAttribute('href') === '') $('reportLink').style.display = 'none';
}

function renderFed() {
  const f = AHEAD && AHEAD.fed; if (!f) return;
  $('fed').hidden = false;
  const pct = n => Number(n).toFixed(2);
  $('fedRate').textContent = `${pct(f.lower)}–${pct(f.upper)}%`;
  const lc = f.lastChange;
  $('fedLast').innerHTML = lc
    ? `Last move: <b>${lc.bps > 0 ? '+' : '−'}${Math.abs(lc.bps / 100).toFixed(2)}</b> ${lc.bps > 0 ? 'hike' : 'cut'}, ${new Date(lc.effective + 'T12:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}`
    : `Effective rate ${f.effr}%`;
  if (f.next) {
    $('fedWhen').innerHTML = `${esc(f.next.local.replace(/(\d+):00/, '$1').replace('AM', 'am').replace('PM', 'pm'))} <span style="font-weight:400;color:var(--dim);font-size:11px">Sydney</span>${f.next.sep ? '<span class="dp" title="New projections and dot plot">DOT PLOT</span>' : ''}`;
    const ms = new Date(f.next.utc) - Date.now();
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5);
    $('fedCount').innerHTML = ms > 0 ? `in <b>${d}d ${h}h</b> · 2pm ET statement, 2:30 presser` : '<b>Decision out now</b>';
  }
  const o = f.outlook;
  if (o && o.text) { $('fedOutlook').hidden = false; $('fedOutlook').textContent = `Market pricing: ${o.text} (${o.source || 'source'}, checked ${fmtDate(o.updated)})`; }
}
const tagRank = t => t === 'MAG7' ? 0 : t === 'NQ' ? 1 : 2;
function renderFuture() {
  if (!AHEAD) { $('future').innerHTML = '<div class="empty">No look-ahead data yet. Run build-dashboard.ps1 -Refresh.</div>'; return; }
  $('futureSub').textContent = `Big US releases (checked ${AHEAD.eventsUpdated ? fmtDate(AHEAD.eventsUpdated) : 'never'}) · earnings · OPEX · holidays`;
  const open = JSON.parse(localStorage.getItem('openWeeks') || 'null') || [AHEAD.weeks[0]];
  $('future').innerHTML = AHEAD.weeks.map(mon => {
    const days = [0, 1, 2, 3, 4].map(i => { const d = new Date(mon + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + i); return d.toISOString().slice(0, 10); });
    const inWk = x => days.includes(x.day);
    const ev = AHEAD.events.filter(inWk), er = AHEAD.earnings.filter(inWk), op = AHEAD.opex.filter(inWk), ho = AHEAD.holidays.filter(inWk);
    const shortName = t => t.replace(/ \(.*?\)| \+.*$|, .*$/g, '').replace('Non-Farm Payrolls', 'NFP').replace('FOMC rate decision', 'FOMC');
    const hl = [
      ...ev.map(e => `<span class="hl hlev">${esc(shortName(e.title))} ${fmtDay(e.day).slice(0, 3)}</span>`),
      ...op.map(o => `<span class="hl ${o.kind === 'quad' ? 'solid' : 'gold'}">${o.kind === 'roll' ? 'Roll' : esc(o.label)} ${fmtDay(o.day).slice(0, 3)}</span>`),
      ...ho.filter(h => h.country === 'US market').map(h => `<span class="hl">${/^CLOSED/.test(h.name) ? 'US closed' : 'Early close'} ${fmtDay(h.day).slice(0, 3)}</span>`),
      ...er.filter(x => x.tag).sort((a, b) => tagRank(a.tag) - tagRank(b.tag)).slice(0, 6).map(x => `<span class="hl ${x.tag === 'MAG7' ? 'solid' : 'gold'}">${esc(x.symbol)}</span>`)
    ].join('') || '<span class="hl">Quiet week so far</span>';
    const grid = days.map(day => {
      const badges = [
        ...op.filter(o => o.day === day).map(o => `<span class="badge ${o.kind}">${o.kind === 'roll' ? 'Roll date' : esc(o.label)}</span>`),
        ...ho.filter(h => h.day === day).map(h => h.country === 'US market'
          ? `<span class="badge ${/^CLOSED/.test(h.name) ? 'closed' : 'early'}">${/^CLOSED/.test(h.name) ? 'US closed' : 'Early close 1pm ET'}</span>`
          : `<span class="badge bank" title="${esc(h.name)}">${esc(h.country.replace(' bank holiday', ''))} hol: ${esc(h.name.replace(/ \(.*\)$/, ''))}</span>`)
      ].join('');
      const evs = ev.filter(e => e.day === day).sort((a, b) => a.sort - b.sort).map(e => `<div class="ev high"><div class="dot"></div><div>
          <div class="ev-time">${esc(e.local.replace(/^\w+ /, ''))}<small>${esc(e.ny)}</small></div>
          <div class="ev-title"><span class="cc">USD</span>${esc(e.title)}</div>
          ${e.status === 'verify' ? `<div class="ev-meta"><span class="verify" title="${esc(e.source)}">verify date</span></div>` : ''}</div></div>`).join('');
      const tks = er.filter(x => x.day === day).sort((a, b) => tagRank(a.tag) - tagRank(b.tag) || b.capB - a.capB)
        .map(x => `<span class="tk ${x.tag}" title="${esc(x.name)} · $${x.capB}B · ${x.time === 'BMO' ? 'before open' : x.time === 'AMC' ? 'after close' : 'time TBC'}">${esc(x.symbol)}<small>${x.time === 'TBC' ? '' : x.time}</small></span>`).join('');
      return `<div class="fday"><div class="fday-name">${fmtDay(day).slice(0, 3)}<small>${fmtDate(day)}</small></div>
        ${badges ? `<div class="badges">${badges}</div>` : ''}${evs}${tks ? `<div class="tickers">${tks}</div>` : ''}
        ${!badges && !evs && !tks ? '<div class="empty" style="margin-top:6px">Nothing major</div>' : ''}</div>`;
    }).join('');
    return `<details class="wk" data-wk="${mon}" ${open.includes(mon) ? 'open' : ''}>
      <summary><span class="wk-name">Week of ${fmtDate(mon)}</span><span class="wk-hl">${hl}</span></summary>
      <div class="wk-grid">${grid}</div></details>`;
  }).join('') + (AHEAD.warnings && AHEAD.warnings.length ? `<div class="empty">${esc(AHEAD.warnings.join(' · '))}</div>` : '');
  document.querySelectorAll('.wk').forEach(d => d.addEventListener('toggle', () => {
    localStorage.setItem('openWeeks', JSON.stringify([...document.querySelectorAll('.wk[open]')].map(x => x.dataset.wk)));
  }));
}
// ---- Theme picker. Swatches: base, panel, gold, red, purple (what the preview shows).
const THEMES = [
  { id: 'royal',    name: 'Royal',          desc: 'Purple & gold (default)', sw: ['#140A1F', '#1E1030', '#D4AF37', '#B3122E', '#4B1E78'] },
  { id: 'midnight', name: 'Midnight',       desc: 'Extra dark, for night',   sw: ['#06030A', '#0E0816', '#A88A2C', '#8A0E24', '#351457'] },
  { id: 'daylight', name: 'Daylight',       desc: 'Light cream, for day',    sw: ['#F6F1E7', '#FFFFFF', '#C9A227', '#B3122E', '#4B1E78'] },
  { id: 'crimson',  name: 'Crimson',        desc: 'Deep wine, red-led',      sw: ['#15050B', '#240A15', '#D4AF37', '#D0163E', '#5A1846'] },
  { id: 'regal',    name: 'Royal Crimson',  desc: 'Purple with red accents', sw: ['#120919', '#1D0F2B', '#D4AF37', '#C4173B', '#4B1E78'] }
];
function setTheme(id) {
  document.documentElement.dataset.theme = id; localStorage.setItem('theme', id);
  const t = THEMES.find(x => x.id === id) || THEMES[0]; $('themeColor').setAttribute('content', t.sw[0]);
  document.querySelectorAll('.th').forEach(b => b.classList.toggle('on', b.dataset.id === id));
}
$('themes').innerHTML = THEMES.map(t => `<button class="th" data-id="${t.id}">
  <div class="th-prev" style="background: radial-gradient(120px 60px at 20% 0%, ${t.sw[4]}88, transparent), ${t.sw[0]}">
    <i style="background:${t.sw[1]};border:1px solid ${t.sw[4]}"></i><i style="background:${t.sw[2]}"></i><i style="background:${t.sw[3]}"></i><i style="background:${t.sw[4]}"></i>
  </div>
  <div class="th-name">${t.name}</div><div class="th-desc">${t.desc}</div></button>`).join('');
document.querySelectorAll('.th').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.id)));
setTheme(localStorage.getItem('theme') || 'royal');
$('themeBtn').addEventListener('click', e => { e.stopPropagation(); const p = $('themePop'); p.hidden = !p.hidden; $('themeBtn').setAttribute('aria-expanded', String(!p.hidden)); });
document.addEventListener('click', e => { if (!e.target.closest('.theme-wrap')) $('themePop').hidden = true; });

// Remember whether the whole section is collapsed
const fb = $('futureBox'); if (localStorage.getItem('futureOpen') === '0') fb.open = false;
fb.addEventListener('toggle', () => localStorage.setItem('futureOpen', fb.open ? '1' : '0'));

// Toggles (remembered)
for (const [id, cls, def, hideWhenOff] of [['tMed', 'hide-med', true, true], ['tUsd', 'hide-nonusd', false, false], ['tNotable', 'hide-notable', true, true]]) {
  const el = $(id); const saved = localStorage.getItem(id);
  el.checked = saved === null ? def : saved === '1';
  const apply = () => { document.body.classList.toggle(cls, hideWhenOff ? !el.checked : el.checked); localStorage.setItem(id, el.checked ? '1' : '0'); };
  el.addEventListener('change', apply); apply();
}
render();
setInterval(() => { $('clock') && render(); }, 60000);
</script>
